<text x="180" y="337" text-anchor="middle" font-size="16" font-weight="800" fill="#b4531a">Looks linked</text>
<text x="180" y="385" text-anchor="middle" font-size="16" fill="#4a5e52">They appear together, but the</text>
<text x="180" y="407" text-anchor="middle" font-size="16" fill="#4a5e52">shared factor is driving both.</text>
